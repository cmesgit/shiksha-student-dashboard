name: Deploy to Dev

on:
  push:
    branches:
      - Dev

concurrency:
  group: student-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -eu
            cd /home/appuser/frontend/student_dashboard
            git checkout Dev
            git pull --ff-only origin Dev
            npm ci
            stage=$(mktemp -d dist.stage.XXXXXX)
            trap 'rm -rf -- "$stage"' EXIT
            npm run build -- --outDir "$stage"
            test -s "$stage/index.html"
            mkdir -p dist
            # Publish every new asset before the entry page; keep old chunks
            # for visitors who still have the previous release open.
            find "$stage" -mindepth 1 -maxdepth 1 ! -name index.html -exec cp -a -t dist -- {} +
            if [ -f dist/index.html ]; then cp -a dist/index.html dist/index.previous.html; fi
            mv -f "$stage/index.html" dist/index.html
